<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>UWIN Lucky Wheel</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, #ff9b32 0%, #c54d0a 32%, #441305 72%, #160602 100%);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
  padding: 28px 16px 40px;
}

.logo {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: #ffd34e;
}

.subtitle {
  margin-top: 4px;
  color: #ffe6bd;
  font-weight: bold;
  letter-spacing: 3px;
}

.title {
  margin: 22px 0 4px;
  font-size: 27px;
  font-weight: 900;
}

.small {
  color: #ffdba4;
  font-size: 14px;
}

.wheel-wrap {
  position: relative;
  width: min(88vw, 390px);
  height: min(88vw, 390px);
  margin: 35px auto 25px;
}

.pointer {
  position: absolute;
  z-index: 20;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-top: 42px solid #fff3b0;
  filter: drop-shadow(0 4px 3px rgba(0,0,0,.4));
}

.wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 9px solid #ffd36a;
  box-shadow:
    0 0 0 6px #8e3005,
    0 10px 35px rgba(0,0,0,.5),
    0 0 28px rgba(255,179,43,.5);
  position: relative;
  overflow: hidden;
  transition: transform 5.2s cubic-bezier(.12,.72,.12,1);
  background:
    conic-gradient(
      #ffb52e 0deg 45deg,
      #e84d16 45deg 90deg,
      #ffd15a 90deg 135deg,
      #d83a13 135deg 180deg,
      #ff9f1c 180deg 225deg,
      #c72c0c 225deg 270deg,
      #ffc94a 270deg 315deg,
      #ef6218 315deg 360deg
    );
}

.label {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
}

.label span {
  position: absolute;
  top: 11%;
  font-size: 18px;
  font-weight: 900;
  text-shadow: 0 2px 3px rgba(0,0,0,.65);
}

.spin-center {
  position: absolute;
  z-index: 10;
  width: 94px;
  height: 94px;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  border-radius: 50%;
  background: linear-gradient(#fff5b7,#ffb31f);
  border: 7px solid #8d2d04;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8b2700;
  font-weight: 900;
  font-size: 21px;
  box-shadow: 0 5px 14px rgba(0,0,0,.45);
}

button {
  width: min(330px, 90%);
  border: 0;
  border-radius: 16px;
  padding: 17px 20px;
  font-size: 21px;
  font-weight: 900;
  color: #7b2500;
  background: linear-gradient(180deg,#fff2a5,#ffb52b);
  box-shadow: 0 7px 0 #9b3906, 0 12px 22px rgba(0,0,0,.3);
  cursor: pointer;
}

button:active {
  transform: translateY(4px);
  box-shadow: 0 3px 0 #9b3906;
}

button:disabled {
  opacity: .65;
}

.result {
  min-height: 88px;
  margin: 28px auto 0;
  max-width: 390px;
  padding: 18px;
  border: 2px solid rgba(255,215,116,.5);
  border-radius: 18px;
  background: rgba(63,14,0,.5);
}

.result-title {
  font-size: 15px;
  color: #ffd88d;
}

.prize {
  margin-top: 6px;
  font-size: 34px;
  font-weight: 900;
  color: #fff2a5;
}

.note {
  margin-top: 22px;
  color: #ffd9aa;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">U<span>WIN</span></div>
  <div class="subtitle">LUCKY WHEEL</div>

  <div class="title">🎡 SPIN & WIN 🎡</div>
  <div class="small">Tekan SPIN untuk cuba nasib anda!</div>

  <div class="wheel-wrap">

    <div class="pointer"></div>

    <div class="wheel" id="wheel">

      <div class="label" style="transform:rotate(22.5deg)">
        <span>10%</span>
      </div>

      <div class="label" style="transform:rotate(67.5deg)">
        <span>20%</span>
      </div>

      <div class="label" style="transform:rotate(112.5deg)">
        <span>30%</span>
      </div>

      <div class="label" style="transform:rotate(157.5deg)">
        <span>40%</span>
      </div>

      <div class="label" style="transform:rotate(202.5deg)">
        <span>RM3</span>
      </div>

      <div class="label" style="transform:rotate(247.5deg)">
        <span>RM5</span>
      </div>

      <div class="label" style="transform:rotate(292.5deg)">
        <span>RM7</span>
      </div>

      <div class="label" style="transform:rotate(337.5deg)">
        <span>RM9</span>
      </div>

    </div>

    <div class="spin-center">UWIN</div>

  </div>

  <button id="spinButton" onclick="spinWheel()">
    🎡 SPIN SEKARANG
  </button>

  <div class="result" id="result">
    <div class="result-title">HADIAH ANDA</div>
    <div class="prize">?</div>
  </div>

  <div class="note">
    Keputusan adalah berdasarkan sistem Lucky Wheel.
  </div>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
const API_URL = "https://uwin-lucky-wheel.onrender.com";
const tg = window.Telegram?.WebApp;
const customerId = tg?.initDataUnsafe?.user?.id;
alert("Telegram ID: " + customerId);
const prizes = [
  { name: "10%", weight: 6, index: 0 },
  { name: "20%", weight: 30, index: 1 },
  { name: "30%", weight: 22, index: 2 },
  { name: "40%", weight: 2, index: 3 },
  { name: "RM3", weight: 5, index: 4 },
  { name: "RM5", weight: 8, index: 5 },
  { name: "RM7", weight: 11, index: 6 },
  { name: "RM9", weight: 16, index: 7 }
];

let spinning = false;
let currentRotation = 0;

function choosePrize() {
  const random = Math.random() * 100;
  let total = 0;

  for (const prize of prizes) {
    total += prize.weight;

    if (random < total) {
      return prize;
    }
  }

  return prizes[1];
}

async function spinWheel() {

if (!customerId) {
  alert("Sila buka Lucky Wheel melalui Telegram.");
  return;
}

  if (spinning) return;
const spinCheck = await fetch(API_URL + "/spin/" + customerId, {
  method: "POST"
});

if (!spinCheck.ok) {
  alert("❌ Tiada peluang SPIN. Sila topup dahulu.");
  return;
}

const spinData = await spinCheck.json();
  spinning = true;

  const button = document.getElementById("spinButton");
  const wheel = document.getElementById("wheel");
  const result = document.getElementById("result");

  button.disabled = true;
  button.innerHTML = "🎡 SEDANG BERPUTAR...";

  result.innerHTML =
    '<div class="result-title">HADIAH ANDA</div>' +
    '<div class="prize">...</div>';

  const prize = choosePrize();

  const segment = 45;
  const centerAngle = prize.index * segment + segment / 2;

  const extraTurns = 360 * 7;

  const normalizedCurrent = ((currentRotation % 360) + 360) % 360;
  const targetNormalized = (360 - centerAngle) % 360;

  let delta = targetNormalized - normalizedCurrent;

  if (delta < 0) {
    delta += 360;
  }

  currentRotation += extraTurns + delta;

  wheel.style.transform =
    "rotate(" + currentRotation + "deg)";

  setTimeout(() => {

    result.innerHTML =
      '<div class="result-title">🎉 TAHNIAH! ANDA DAPAT 🎉</div>' +
      '<div class="prize">' + prize.name + '</div>';

    button.innerHTML = "🎡 SPIN LAGI";
    button.disabled = false;

    spinning = false;

    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.HapticFeedback.notificationOccurred("success");
    }

  }, 5400);
}

if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}
</script>

</body>
</html>
